<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Dream Drugs House</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">💊 DREAM DRUGS HOUSE</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="doctors.html">Our Doctors</a>
        <a href="appointment.html">Appointment</a>
        <a href="contact.html">Contact Us</a>
    </nav>
</header>

<section class="appointment-banner">
    <h1>Book Your Appointment</h1>
    <p>Fill in your details to request an appointment</p>
</section>

<section class="appointment-container">

    <h2>Patient Appointment Form</h2>

    <form id="appointmentForm">

        <label>Patient Name</label>
        <input type="text" id="patientName" required
        placeholder="Enter your full name">

        <label>Phone Number</label>
        <input type="tel" id="phone" required
        pattern="[0-9]{10}" maxlength="10"
        placeholder="Enter 10 digit mobile number">

        <label>Select Doctor</label>
        <select id="doctor" required>
            <option value="">Choose Doctor</option>
            <option>Dr. Rajib sikder</option>
            <option>Dr.  T R Saha </option>
            
        </select>

        

        <label>Gender</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Health Problem</label>
        <textarea id="problem" rows="4"
        placeholder="Write your health problem"></textarea>

        <button type="submit" class="btn">
            Submit Appointment Request
        </button>

    </form>

    <div id="result"></div>

</section>

<footer>
    <h3>DREAM DRUGS HOUSE</h3>
    <p>Care • Trust • Health</p>
    <p>© 2026 All Rights Reserved.</p>
</footer>

<script>
const doctorParam = new URLSearchParams(window.location.search)
    .get("doctor");

if (doctorParam) {
    document.getElementById("doctor").value = doctorParam;
}

document.getElementById("date").min =
    new Date().toISOString().split("T")[0];

document.getElementById("appointmentForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("patientName").value;
    const phone = document.getElementById("phone").value;
    const doctor = document.getElementById("doctor").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const gender = document.getElementById("gender").value;
    const problem = document.getElementById("problem").value;

    const result = document.getElementById("result");

    result.innerHTML = `
        <h2>Appointment Request</h2>
        <p><b>Patient:</b> ${name}</p>
        <p><b>Phone:</b> ${phone}</p>
        <p><b>Doctor:</b> ${doctor}</p>
        <p><b>Date:</b> ${date}</p>
        <p><b>Time:</b> ${time}</p>
        <p><b>Gender:</b> ${gender}</p>
        <p><b>Problem:</b> ${problem || "Not provided"}</p>
        <h3>Pending Confirmation</h3>
        <button onclick="window.print()">Print Request</button>
    `;

});
</script>

</body>
</html>
