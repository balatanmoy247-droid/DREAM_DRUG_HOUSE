<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Doctors - Dream Drugs House</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" class="logo">💊 DREAM DRUGS HOUSE</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="doctors.html">Our Doctors</a>
    <a href="appointment.html">Appointment</a>
    <a href="contact.html">Contact Us</a>
  </nav>
</header>

<section class="doctor-banner">
  <h1>Meet Our Doctors</h1>
  <p>Our Trusted Medical Professionals</p>
</section>

<section class="doctor-list" id="doctorList">
  <p style="text-align:center; grid-column:1/-1;">Loading doctors...</p>
</section>

<footer>
  <h3>DREAM DRUGS HOUSE</h3>
  <p>Care • Trust • Health</p>
  <p>© 2026 All Rights Reserved.</p>
</footer>

<script type="module">
  import { db, escapeHtml } from "./firebase-config.js";
  import { collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const listEl = document.getElementById("doctorList");
  const q = query(collection(db, "doctors"), orderBy("createdAt", "desc"));

  onSnapshot(q, (snapshot) => {
    if (snapshot.empty) {
      listEl.innerHTML = `<p style="text-align:center; grid-column:1/-1;">No doctors listed right now. Please check back soon.</p>`;
      return;
    }

    listEl.innerHTML = "";
    snapshot.forEach((docSnap) => {
      const d = docSnap.data();
      const card = document.createElement("div");
      card.className = "doctor-card";
      card.innerHTML = `
        <img src="${escapeHtml(d.photo || 'https://via.placeholder.com/400x280?text=Doctor')}" alt="${escapeHtml(d.name)}">
        <div class="doctor-info">
          <h2>${escapeHtml(d.name)}</h2>
          <p>${escapeHtml(d.description)}</p>
          <p><b>Available:</b> ${escapeHtml(d.available)}</p>
          <p><b>Time:</b> ${escapeHtml(d.time)}</p>
          <a href="appointment.html?doctor=${encodeURIComponent(d.name)}" class="btn">Book Appointment</a>
        </div>
      `;
      listEl.appendChild(card);
    });
  }, (err) => {
    listEl.innerHTML = `<p style="text-align:center; color:red; grid-column:1/-1;">Failed to load doctors: ${escapeHtml(err.message)}</p>`;
  });
</script>

</body>
</html>
